<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${pageTitle}"></title>
        <link rel="stylesheet" th:href="@{/microservice-frontend/styles.css}">
        <link rel="stylesheet" th:href="@{/styles.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/363fc0775f.js" crossorigin="anonymous"></script>
        <script src="https://cdn.tiny.cloud/1/bpi509giv7txevb5cm2xld7k0vh19crqngccv5r0fhvzuwx6/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
        <script>
            tinymce.init({
                selector: 'textarea#description'
            });
        </script>
    </head>
    <body>
        <div class="container p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 th:text="${note.getId() != null} ? 'Modification de note d\'observation' : 'Créer une nouvelle note d\'observation'"></h1>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</button>
                </form>
            </div>
            <form th:action="@{${note.getId() != null} ? '/microservice-frontend/patient/' + ${note.getPatientId()} + '/note/' + ${note.getId()} + '/update' : '/microservice-frontend/patient/' + ${note.getPatientId()} + '/create-note'}" th:object="${note}" method="post" class="form-horizontal">
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" placeholder="Description" th:field="*{description}"></textarea>
                    <small class="error" th:errors="*{description}" th:if="${#fields.hasErrors('description')}"></small>
                </div>
                <div class="mb-5">
                    <label for="date" class="form-label">Date du rendez-vous</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}">
                    <small class="error" th:errors="*{date}" th:if="${#fields.hasErrors('date')}"></small>
                </div>
                <div class="text-center">
                    <a class="btn btn-secondary me-2" th:href="@{|/microservice-frontend/patient/${note.getPatientId()}}"><i class="fas fa-times me-2"></i>Annuler</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check me-2"></i>
                        <span th:text="${note.getPatientId() != null} ? 'Modifier' : 'Valider'"></span>
                    </button>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
