<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head.html}"></head>
    <body>
        <div class="container p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Liste des patients</h1>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</button>
                </form>
            </div>
            <table class="table table-striped table-borderless" th:if="${patients.getContent().size() > 0}">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date de naissance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.getLastname()}"></td>
                        <td th:text="${patient.getFirstname()}"></td>
                        <td th:text="${#temporals.format(patient.getBirthdate(), 'dd/MM/yyyy')}"></td>
                        <td class="btn-td">
                            <a class="btn btn-success me-3" th:href="@{|/microservice-frontend/patient/${patient.getId()}|}"><i class="fas fa-info-circle fa-lg me-2"></i>Consulter</a>
                            <a class="btn btn-primary me-3" th:href="@{|/microservice-frontend/patient/${patient.getId()}/edition|}"><i class="fas fa-edit fa-lg me-2"></i>Modifier</a>
                            <a class="btn btn-danger" th:href="@{|/microservice-frontend/patient/${patient.getId()}/delete|}"><i class="fas fa-trash-alt fa-lg me-2"></i>Supprimer</a>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-center">
                            <a href="/microservice-frontend/create-patient">
                                <button type="button" class="btn btn-secondary"><i class="fas fa-plus-circle me-2"></i>Créer un nouveau patient</button>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${patients.getContent().size() == 0}">
                <p class="h5" >Pas de patient.</p>
                <a href="/microservice-frontend/create-patient" class="my-5">
                    <button type="button" class="btn btn-secondary"><i class="fas fa-plus-circle me-2"></i>Créer un nouveau patient</button>
                </a>
            </div>
            <nav th:replace="~{fragments/pagination.html}"></nav>
            <th:block th:if="${param.toastMessage}">
                <th:block th:with="toastMessage=${param.toastMessage[0]}">
                    <div th:replace="~{fragments/toast-success :: toast-success (message = ${toastMessage})}"></div>
                </th:block>
            </th:block>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
